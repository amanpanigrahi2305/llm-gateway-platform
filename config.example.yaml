# LLM Gateway Platform - example config.
# Copy to config.local.yaml (git ignores it) and edit it. Provider API keys never
# go in this file: put them in .env and name the variable in api_key_env.

server:
  addr: ":8080"
  shutdown_timeout: 30s   # after SIGTERM, open requests and streams get this long to finish
  drain_delay: 0s         # wait this long (while reporting not-ready) before shutdown; ~5s on Kubernetes
  max_connection_age: 30s # ask clients to reconnect after this long (±10%), so new pods get traffic; -1s = off

# Timeouts per provider (defaults shown on mock):
#   connect_timeout  TCP connect + TLS handshake           (default 5s)
#   ttft_timeout     streaming: wait for the first token    (default 30s)
#                    raise it for models that think a long time before answering
#   timeout          the whole call                         (default 5m)
providers:
  mock:
    type: mock
    base_url: http://localhost:9090/v1
    connect_timeout: 5s
    ttft_timeout: 30s
    timeout: 5m
  ollama:
    type: ollama
    base_url: http://localhost:11434/v1
    ttft_timeout: 60s     # the first call loads the model (about 16 s measured on a laptop)
  # anthropic:
  #   type: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  # openai:
  #   type: openai
  #   api_key_env: OPENAI_API_KEY

# Clients ask for an alias, never a raw model name. Each alias is an ordered list
# of provider/model targets: the first healthy one serves, the rest are failover.
aliases:
  fast: ["mock/mock-1"]
  local: ["ollama/qwen2.5:0.5b"]
  # smart: ["anthropic/claude-opus-5-5"]

# Retries: temporary errors (408, 429, 5xx, timeouts, connection errors) are
# retried on the same target, then the next target takes over. Client errors
# (400, 413, 422) are never retried. A stream is never retried after its first chunk.
reliability:
  max_attempts: 2        # tries per target, the first try included
  backoff_base: 100ms    # wait before the first retry (random 0..base, doubles each retry)
  backoff_max: 2s        # longest wait between two tries
  breaker_failures: 5    # failures in a row that open a provider's circuit breaker
  breaker_cooldown: 30s  # open time; then one probe request tests the provider

# USD per 1M tokens. Every alias target needs a price (0 for local models), so a
# paid model is never silently reported as $0. Check each provider's pricing page.
prices:
  "mock/mock-1": {input_per_million: 1.00, output_per_million: 2.00}   # fake prices, to see the cost math
  "ollama/qwen2.5:0.5b": {input_per_million: 0, output_per_million: 0}
  # "anthropic/claude-opus-5-5": {input_per_million: 4.00, output_per_million: 20.00}

# Where rate-limit and budget counters live. With more than one gateway replica
# they MUST be in Redis: in-memory counters let each replica allow the full limit.
limits:
  redis_url_env: GATEWAY_REDIS_URL   # env var with the URL, e.g. redis://localhost:6380/0
                                     # remove this line for in-memory counters (one replica only)
  on_store_error: fail_open          # Redis down: fail_open lets requests through,
                                     # fail_closed refuses them with 503

# Limit policies. Each key names one. 0 means no limit. Windows are UTC.
# A hit limit returns 429 with Retry-After.
policies:
  default:
    requests_per_minute: 60
    tokens_per_minute: 100000
    daily_usd: 5
    monthly_usd: 50

# Usage ledger: one Postgres row per request (metadata only, never prompt or
# answer text), written in the background in batches. A request never waits for
# the database; if the buffer fills up, records are dropped and counted.
# Remove database_url_env to turn the ledger off (records still go to the log).
ledger:
  database_url_env: GATEWAY_DATABASE_URL   # env var with the URL (it holds a password)
  # password_env: GATEWAY_DB_PASSWORD      # optional: env var whose value replaces the
  #                                        # URL's password (for generated passwords with # ? %)
  buffer_size: 10000
  batch_size: 500
  flush_interval: 1s

# Response cache. OFF by default: it keeps answer text in memory (never on disk).
# Only non-streaming requests with temperature 0 are cached, separately per key.
cache:
  enabled: false
  ttl: 5m
  max_entries: 1000

# Client keys. Run `gateway gen-key`, give the key to the client, paste the hash here.
keys:
  - id: dev
    owner: aman
    team: platform
    hash: "replace-with-the-hash-from-gateway-gen-key"
    aliases: ["*"]
    policy: default
