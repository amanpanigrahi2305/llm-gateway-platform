{{- if .Values.secretsStore.enabled }}
# Secrets from AWS Secrets Manager, read with the pod's own identity (EKS Pod
# Identity) by the Secrets Store CSI Driver and its AWS provider. They are
# synced into the Kubernetes Secret <release>-store, which the gateway reads as
# environment variables. A JSON secret (like the RDS-managed one) can be
# narrowed to one key with jmesPath.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      {{- range .Values.secretsStore.objects }}
      - objectName: {{ .name | quote }}
        objectType: secretsmanager
        {{- if .jmesPath }}
        objectAlias: {{ printf "%s-json" .env | quote }}
        jmesPath:
          - path: {{ .jmesPath | quote }}
            objectAlias: {{ .env | quote }}
        {{- else }}
        objectAlias: {{ .env | quote }}
        {{- end }}
      {{- end }}
  secretObjects:
    - secretName: {{ include "llm-gateway.fullname" . }}-store
      type: Opaque
      data:
        {{- range .Values.secretsStore.objects }}
        - objectName: {{ .env | quote }}
          key: {{ .env }}
        {{- end }}
{{- end }}
