# Gateway config for the AWS example (see config.example.yaml for every key).
# Terraform adds: server, limits, ledger, keys, and the bedrock provider with
# this region (main.tf, local.gateway_config).
#
# Prices are USD per 1 million tokens. Fill them in from each provider's
# current price list before relying on budgets: 0 means the cost of that model
# is not counted.

providers:
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
  openai:
    type: openai
    api_key_env: OPENAI_API_KEY

aliases:
  # First healthy target serves; the rest are failover.
  fast: ["bedrock/amazon.nova-micro-v1:0", "anthropic/claude-haiku-5-5", "openai/gpt-5-mini"]

prices:
  "bedrock/amazon.nova-micro-v1:0": {input_per_million: 0, output_per_million: 0}
  "anthropic/claude-haiku-5-5": {input_per_million: 0, output_per_million: 0}
  "openai/gpt-5-mini": {input_per_million: 0, output_per_million: 0}

policies:
  default:
    requests_per_minute: 60
    tokens_per_minute: 100000
    daily_usd: 5
