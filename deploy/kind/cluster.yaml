# Local Kubernetes for development and tests: 1 control plane + 2 workers
# (two workers, so pods spread over nodes and a node drain can be tested).
# Ports are published on 127.0.0.1 only.
#
# The node image is pinned by digest (from the kind v0.33.0 release notes), so
# every run uses the same Kubernetes build and a changed image cannot slip in.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-gateway
nodes:
  - role: control-plane
    image: &node kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      - {containerPort: 30080, hostPort: 8088, listenAddress: "127.0.0.1"}   # gateway (NodePort)
      - {containerPort: 30091, hostPort: 9190, listenAddress: "127.0.0.1"}   # mock-a admin API
      - {containerPort: 30092, hostPort: 9191, listenAddress: "127.0.0.1"}   # mock-b admin API
  - role: worker
    image: *node
  - role: worker
    image: *node
